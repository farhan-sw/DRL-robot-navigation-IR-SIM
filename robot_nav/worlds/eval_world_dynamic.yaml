world:
  height: 10  # the height of the world
  width: 10   # the height of the world
  step_time: 0.3  # Hz calculate each step
  sample_time: 0.3  # Hz for render and data extraction
  collision_mode: 'reactive'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'rectangle', length: 1.0, width: 0.5}
    vel_min: [ -1.0, -1.0 ]
    vel_max: [ 1.0, 1.0 ]
    state: [3, 4, 0]
    goal: [9, 9, 0]
    arrive_mode: position
    goal_threshold: 0.3

    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 7
        angle_range: 3.14
        number: 180
        noise: True
        std: 0.08
        angle_std: 0.1
        offset: [ 0, 0, 0 ]
        alpha: 0.3

    plot:
      show_trajectory: True

obstacle:
  # --- Dynamic Obstacles designed to block A* paths in Scenarios 6-10 ---
  # Scenario 6: [9,9] to [5,1]. Block at [7,5]
  - number: 1
    kinematics: {name: 'omni'}
    state: [7, 5, 0]
    behavior: {name: 'rvo', wander: True, range_low: [5, 4.5, -3.14], range_high: [9, 5.5, 3.14], vxmax: 0.4, vymax: 0.4, factor: 1.0}
    vel_max: [0.4, 0.4]
    vel_min: [-0.4, -0.4]
    shape: {name: 'circle', radius: 0.4}

  # Scenario 7: [2,9] to [7,4]. Block at [5,6]
  - number: 1
    kinematics: {name: 'omni'}
    state: [5, 6, 0]
    behavior: {name: 'rvo', wander: True, range_low: [4.5, 4, -3.14], range_high: [5.5, 8, 3.14], vxmax: 0.4, vymax: 0.4, factor: 1.0}
    vel_max: [0.4, 0.4]
    vel_min: [-0.4, -0.4]
    shape: {name: 'circle', radius: 0.4}

  # Scenario 8: [3,6] to [9,4]. Block at [6,5]
  - number: 1
    kinematics: {name: 'omni'}
    state: [6, 5, 0]
    behavior: {name: 'rvo', wander: True, range_low: [5.5, 3, -3.14], range_high: [6.5, 7, 3.14], vxmax: 0.4, vymax: 0.4, factor: 1.0}
    vel_max: [0.4, 0.4]
    vel_min: [-0.4, -0.4]
    shape: {name: 'circle', radius: 0.4}

  # Scenario 9: [1,7] to [1,9]. Block at [1,8]
  - number: 1
    kinematics: {name: 'omni'}
    state: [1, 8, 0]
    behavior: {name: 'rvo', wander: True, range_low: [0.2, 7.5, -3.14], range_high: [1.8, 8.5, 3.14], vxmax: 0.4, vymax: 0.4, factor: 1.0}
    vel_max: [0.4, 0.4]
    vel_min: [-0.4, -0.4]
    shape: {name: 'circle', radius: 0.4}

  # Scenario 10: [5,7] to [5,1]. Block at [5,4]
  - number: 1
    kinematics: {name: 'omni'}
    state: [5, 4, 0]
    behavior: {name: 'rvo', wander: True, range_low: [3.5, 3.5, -3.14], range_high: [6.5, 4.5, 3.14], vxmax: 0.4, vymax: 0.4, factor: 1.0}
    vel_max: [0.4, 0.4]
    vel_min: [-0.4, -0.4]
    shape: {name: 'circle', radius: 0.4}

  # --- Original Static Obstacles ---
  - shape: { name: 'circle', radius: 1.0 }
    state: [ 5, 5, 0 ]
  - shape: { name: 'circle', radius: 0.5 }
    state: [ 7, 8, 0 ]
  - shape: { name: 'circle', radius: 1.4 }
    state: [ 3, 1, 0 ]
  - shape: {name: 'rectangle', length: 1.0, width: 1.2}
    state: [8, 5, 1]
  - shape: { name: 'rectangle', length: 0.5, width: 2.1 }
    state: [ 1, 8, 1.3 ]
  - shape: { name: 'rectangle', length: 1.5, width: 0.7 }
    state: [ 6, 2, 0.5 ]

  - shape: { name: 'linestring', vertices: [ [ 0, 0 ], [ 10, 0 ], [ 10, 10 ], [ 0, 10 ],[ 0, 0 ]  ] }
    kinematics: {name: 'static'}
    state: [ 0, 0, 0 ]
